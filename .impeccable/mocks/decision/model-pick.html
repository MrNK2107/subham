<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#0b1030;font-family:'Baloo 2',sans-serif;color:#f7f3e8}
.nav{position:absolute;top:26px;left:56px;right:56px;display:flex;gap:28px;align-items:center;font-weight:500}
.logo{font-weight:800;font-size:28px;color:#ffb703}.sp{flex:1}
.strand{position:absolute;left:-20px;right:-20px;height:120px;border-bottom:2px solid #333a66;border-radius:0 0 50% 50%}
.bulbs{position:absolute;left:0;right:0;display:flex;justify-content:space-around}
.b{width:14px;height:20px;border-radius:50%;box-shadow:0 0 18px 6px currentColor;background:currentColor}
.facade{position:absolute;left:330px;right:330px;top:300px;bottom:0;background:#141a45;border-radius:8px 8px 0 0}
.door{position:absolute;left:50%;transform:translateX(-50%);top:340px;width:560px;background:#1c2358;border:2px solid #ffb70366;border-radius:280px 280px 12px 12px;padding:120px 48px 40px;text-align:center}
h1{font-weight:800;font-size:46px;line-height:1.05;margin:0 0 12px}
input{width:100%;box-sizing:border-box;border-radius:12px;border:0;padding:16px;font:inherit;font-size:16px}
.btn{display:inline-block;margin-top:14px;background:#ffb703;color:#0b1030;font-weight:800;border-radius:999px;padding:12px 26px}
</style></head><body>
<div class="nav"><span class="logo">Subham</span><span class="sp"></span><span>My plans</span><span>New plan</span><span>English ▾</span></div>
<div class="strand" style="top:60px"></div><div class="bulbs" style="top:150px;color:#ffb703"><i class="b"></i><i class="b" style="color:#ff5d8f"></i><i class="b"></i><i class="b" style="color:#3ddc97"></i><i class="b"></i><i class="b" style="color:#ff5d8f"></i><i class="b"></i><i class="b" style="color:#3ddc97"></i><i class="b"></i></div>
<div class="strand" style="top:150px"></div><div class="bulbs" style="top:250px;color:#ff5d8f"><i class="b"></i><i class="b" style="color:#ffb703"></i><i class="b"></i><i class="b" style="color:#3ddc97"></i><i class="b"></i><i class="b" style="color:#ffb703"></i><i class="b"></i></div>
<div class="facade"></div>
<div class="door"><h1>Light up every function of your celebration</h1><input value="Ganesh pandal for our society, 600 people, 3 lakh"><span class="btn">Plan it →</span></div>
</body></html>
