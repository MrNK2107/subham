<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#fff;font-family:system-ui,sans-serif;color:#111827}
.nav{display:flex;gap:28px;padding:24px 64px;align-items:center;border-bottom:1px solid #eee}.logo{font-weight:800;font-size:22px;color:#e11d48}.sp{flex:1}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:72px 64px}
h1{font-size:56px;line-height:1.05;margin:0 0 16px}p{color:#4b5563;font-size:18px}
input{width:100%;padding:16px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}
.btn{display:inline-block;margin-top:12px;background:#e11d48;color:#fff;padding:14px 24px;border-radius:10px;font-weight:600}
.shot{background:#f3f4f6;border-radius:16px;height:420px;box-shadow:0 20px 50px #0002}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 64px}.c{border:1px solid #e5e7eb;border-radius:12px;height:120px}
</style></head><body>
<div class="nav"><span class="logo">Subham</span><span class="sp"></span><span>My plans</span><span>New plan</span></div>
<div class="hero"><div><h1>AI event planning for Indian celebrations</h1><p>Budgets, timelines, vendors and ideas in minutes.</p><input value="Wedding in Pune, 300 guests, 15 lakh"><span class="btn">Create plan</span></div><div class="shot"></div></div>
<div class="cards"><div class="c"></div><div class="c"></div><div class="c"></div></div>
</body></html>
